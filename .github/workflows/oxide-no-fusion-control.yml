name: Build Oxide No-Fusion Control APK

on:
  push:
    paths:
      - '.github/workflows/oxide-no-fusion-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Pull LFS assets
        run: git lfs pull
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK and native toolchain
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.0.12077973 cmake;3.22.1
      - name: Accept licenses
        run: yes | sdkmanager --licenses || true
      - name: Build separate diagnostic APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PoxideNativeDiagnostic -PoxideNoFusionControl --no-daemon --stacktrace
      - name: Publish control APK
        uses: actions/upload-artifact@v4
        with:
          name: Oxide-No-Fusion-Control-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
