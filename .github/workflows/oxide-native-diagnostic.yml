name: Build Oxide Native Diagnostic APK

on:
  push:
    paths:
      - '.github/workflows/oxide-native-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Restore native runtime assets from LFS
        run: git lfs pull
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.0.12077973 cmake;3.22.1
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Build isolated diagnostic application
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PoxideNativeDiagnostic --no-daemon --stacktrace
      - name: Upload installable diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: Oxide-BepInEx-Native-Diagnostic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
