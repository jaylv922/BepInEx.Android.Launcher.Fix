name: Build Oxide Read-Only Path Check APK

on:
  push:
    paths:
      - '.github/workflows/oxide-readonly-path-check.yml'
      - 'app/src/main/java/com/bepinex/android/tools/OxidePathDiagnostics.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Retrieve native runtime assets
        run: git lfs pull
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.0.12077973 cmake;3.22.1
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true
      - name: Build isolated read-only path diagnostic
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PoxideNativeDiagnostic -PoxideNoFusionControl -PoxidePathDiagnostic --no-daemon --stacktrace
      - name: Upload Oxide path-check APK
        uses: actions/upload-artifact@v4
        with:
          name: Oxide-ReadOnly-Path-Check-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
